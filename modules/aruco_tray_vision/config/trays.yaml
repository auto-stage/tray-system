# ArUco ID (mapping key) is the canonical/fixed tray identity.
# tray_code/display_name/marker_size/marker_to_grip are operator-configurable.
#
# marker_to_grip_mm:
# rigid offset from the ArUco marker origin to the desired grip point,
# expressed in the MARKER coordinate frame.
#
# geometry_calibrated MUST remain false until marker size and grip offset are
# verified on the real tray. Detection/pose monitoring still works while false,
# but automatic X/Z correction remains safety-blocked.

trays:
  1:
    enabled: true
    tray_code: "TRAY-01"
    display_name: "Tray 01"
    marker_size_mm: 50.0
    geometry_calibrated: false
    marker_to_grip_mm: {x: 80.0, y: 30.0, z: 0.0}

  2:
